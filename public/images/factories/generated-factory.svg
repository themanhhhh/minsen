<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MISO JAPAN factory network illustration</title>
  <desc id="desc">Illustrative plywood factory with warehouse, timber stacks and a loading area.</desc>
