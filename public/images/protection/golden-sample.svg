<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Golden sample approval illustration</title>
  <desc id="desc">Plywood sample panels, a checklist and an approval mark arranged on a review table.</desc>
  <defs>
    <linearGradient id="sample-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071e4b"/>
      <stop offset="1" stop-color="#1b4f82"/>
    </linearGradient>
